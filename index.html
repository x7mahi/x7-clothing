<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X7 Clothing Store</title>
    <style>
        /* ----- Basic Dark Theme ----- */
        body { font-family: Arial, sans-serif; margin:0; padding:0; background: #111; color: #fff; }
        header { background: #000; padding: 20px; display:flex; justify-content: space-between; align-items: center; }
        h1 { margin:0; color: #f00; }
        nav button { margin: 0 5px; padding: 10px 15px; border:none; background:#222; color:#fff; cursor:pointer; border-radius:5px; }
        nav button.active { background:#f00; }
        main { padding: 20px; }
        .product-card { background:#222; padding:15px; margin:10px; display:inline-block; width:200px; border-radius:10px; text-align:center; }
        .add-to-cart { margin-top:10px; padding:10px 15px; border:none; background:#f00; color:#fff; cursor:pointer; border-radius:5px; }
        #cart { position:fixed; top:20px; right:20px; background:#222; padding:15px; border-radius:10px; width:200px; }
        #cart-items p { margin:5px 0; }
        .category-btn { margin:5px; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>X7 Clothing</h1>
        <nav>
            <button class="category-btn active" data-category="all">All</button>
            <button class="category-btn" data-category="hoodies">Hoodies</button>
            <button class="category-btn" data-category="tshirts">T-Shirts</button>
            <button class="category-btn" data-category="jackets">Jackets</button>
        </nav>
    </header>

    <!-- Cart -->
    <div id="cart">
        <h3>Cart</h3>
        <p>Items: <span id="cart-count">0</span></p>
        <p>Total: $<span id="cart-total">0</span></p>
        <div id="cart-items"></div>
    </div>

    <!-- Main Products -->
    <main>
        <!-- Product Example 1 -->
        <div class="product-card" data-category="hoodies">
            <h4>Black Hoodie</h4>
            <p>$999</p>
            <button class="add-to-cart" data-product="Black Hoodie" data-price="999">Add to Cart</button>
        </div>

        <!-- Product Example 2 -->
        <div class="product-card" data-category="tshirts">
            <h4>Red T-Shirt</h4>
            <p>$499</p>
            <button class="add-to-cart" data-product="Red T-Shirt" data-price="499">Add to Cart</button>
        </div>

        <!-- Product Example 3 -->
        <div class="product-card" data-category="jackets">
            <h4>Leather Jacket</h4>
            <p>$1499</p>
            <button class="add-to-cart" data-product="Leather Jacket" data-price="1499">Add to Cart</button>
        </div>

        <!-- Add more products as needed -->
    </main>

    <!-- JS -->
    <script src="script.js"></script>
</body>
          </html>
